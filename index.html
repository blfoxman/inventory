<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Fox ERP</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#17140f">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#17140f; --panel:#211d17; --panel2:#2a251d; --line:#3a3226;
    --text:#ede6d8; --dim:#a89a82; --amber:#e0a838; --amber-dim:#8a6a26; --rust:#c1573f; --sage:#8ea377; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}

  #loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .login-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:360px;padding:28px;}
  .login-box h1{margin:0 0 4px;font-size:20px;font-weight:700;}
  .login-box h1 span{color:var(--amber);}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:20px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input,.field select,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13.5px;font-family:inherit;}
  button.primary{font-size:13px;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;border:1px solid var(--amber);background:var(--amber);color:#1a1509;}
  button.primary:hover{filter:brightness(1.08);}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:12.5px;cursor:pointer;}
  button.ghost:hover{background:var(--panel2);}
  button.small{padding:5px 9px;font-size:12px;}
  .err{color:var(--rust);font-size:12px;margin-top:6px;display:none;}
  .err.show{display:block;}
  .hint{font-size:11.5px;color:var(--dim);}

  #shell{display:none;min-height:100vh;}
  #sidebar{width:220px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:14px 0;}
  #sidebar .sb-title{padding:0 18px 14px;font-size:15px;font-weight:700;border-bottom:1px solid var(--line);margin-bottom:8px;}
  #sidebar .sb-title span{color:var(--amber);}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13px;font-weight:600;color:var(--dim);cursor:pointer;border-left:3px solid transparent;}
  .sb-item:hover{background:var(--panel2);color:var(--text);}
  .sb-item.active{background:var(--panel2);color:var(--amber);border-left-color:var(--amber);}
  .sb-item .sb-icon{width:18px;text-align:center;}
  .sb-item.soon{opacity:.4;cursor:default;}
  .sb-item.soon:hover{background:none;color:var(--dim);}
  .sb-soon-tag{font-size:9px;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:auto;}
  #mainContent{flex:1;min-width:0;}
  #app{max-width:1240px;margin:0;padding:20px 24px 80px;}

  header.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  header.topbar h1{font-size:20px;font-weight:700;margin:0;}
  header.topbar h1 span{color:var(--amber);}
  .who{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:10px;}
  .who b{color:var(--text);}

  .toolbar-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .toolbar-row input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;min-width:220px;}
  .toolbar-row select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;}

  .task-card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
  .task-card.high{border-left-color:var(--rust);}
  .task-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .task-title{font-weight:700;font-size:14.5px;margin-bottom:4px;}
  .task-desc{color:var(--dim);font-size:12.5px;margin-bottom:10px;}
  .task-complete-link{color:var(--amber);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .task-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--dim);align-items:center;}
  .task-meta span{display:flex;align-items:center;gap:5px;}
  .task-tag{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11px;}
  .task-status{border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;}
  .task-status.completed{background:rgba(142,163,119,.18);color:var(--sage);}
  .task-status.notstarted{background:var(--panel2);color:var(--dim);}
  .task-status.inprogress{background:rgba(224,168,56,.15);color:var(--amber);}

  .empty-state{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--dim);}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:460px;padding:20px;}
  .modal h3{margin:0 0 14px;font-size:15px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>Black Fox <span>ERP</span></h1>
    <div class="sub">Sign in to continue</div>
    <div class="field"><label>Email</label><input id="loginEmail" type="email"></div>
    <div class="field"><label>Password</label><input id="loginPassword" type="password"></div>
    <div class="err" id="loginErr"></div>
    <button class="primary" style="width:100%;" onclick="submitLogin()">Sign In</button>
  </div>
</div>

<div id="shell">
  <nav id="sidebar">
    <div class="sb-title">Black Fox <span>ERP</span></div>
    <div id="sidebarItems"></div>
  </nav>
  <div id="mainContent">
    <div id="app">
      <header class="topbar">
        <h1 id="pageTitle">Tasks</h1>
        <div class="who">Signed in as <b id="whoName"></b> <button class="ghost" onclick="logout()">Log out</button></div>
      </header>

      <!-- ---------- TASKS ---------- -->
      <div id="tasksView">
        <div class="toolbar-row">
          <input id="taskSearch" placeholder="Search" oninput="renderTasksList()">
          <select id="taskFilterStatus" onchange="renderTasksList()">
            <option value="">Status: All</option>
            <option value="Not Started">Not Started</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
          <select id="taskFilterPriority" onchange="renderTasksList()">
            <option value="">Priority: All</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
          <div style="flex:1;"></div>
          <button class="primary" id="btnCreateTask">+ Create Task</button>
        </div>
        <div id="tasksList"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="modalCreateTask"><div class="modal">
  <h3>Create Task</h3>
  <div class="field"><label>Title</label><input id="tkTitle"></div>
  <div class="field"><label>Description</label><textarea id="tkDescription" rows="2"></textarea></div>
  <div style="display:flex;gap:10px;">
    <div class="field" style="flex:1;"><label>Assignee</label><input id="tkAssignee" placeholder="Unassigned"></div>
    <div class="field" style="flex:1;"><label>Due Date</label><input id="tkDueDate" type="date"></div>
  </div>
  <div style="display:flex;gap:10px;">
    <div class="field" style="flex:1;"><label>Priority</label><select id="tkPriority"><option value="--">--</option><option>High</option><option>Medium</option><option>Low</option></select></div>
    <div class="field" style="flex:1;"><label>Category Tag</label><input id="tkCategoryTag" placeholder="e.g. Compliance"></div>
  </div>
  <div class="field"><label>Profit Center (Optional)</label><input id="tkProfitCenter"></div>
  <div class="err" id="tkErr"></div>
  <div class="modal-actions"><button class="ghost" onclick="closeModal('modalCreateTask')">Cancel</button><button class="primary" onclick="submitCreateTask()">Create Task</button></div>
</div></div>

<script>
const SUPABASE_URL = 'https://sspjcmnbdbbprtzmtigv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZTkMyAT-Ct8db7bZT8d-Qg_CgD9oIhL';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let session = null;
let currentSection = 'tasks';

const SIDEBAR_SECTIONS = [
  {id:'tasks', label:'Tasks', icon:'✓'},
  {id:'activity_ledger', label:'Activity Ledger', icon:'📈', soon:true},
  {id:'plants', label:'Plants', icon:'🌱', soon:true},
  {id:'manufacturing', label:'Manufacturing', icon:'🏭', soon:true},
  {id:'inventory', label:'Inventory', icon:'📦', soon:true},
  {id:'orders', label:'Orders', icon:'🏷️', soon:true},
  {id:'transfers', label:'Transfers', icon:'🚚', soon:true},
  {id:'reports', label:'Reports', icon:'📄', soon:true},
  {id:'accounts_payable', label:'Accounts Payable', icon:'🤝', soon:true},
  {id:'accounts_receivable', label:'Accounts Receivable', icon:'💵', soon:true},
  {id:'settings', label:'Settings', icon:'⚙️', soon:true},
  {id:'illumify_hub', label:'Illumify Hub', icon:'🔗', soon:true},
  {id:'general_ledger', label:'General Ledger', icon:'📖', soon:true}
];

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function loadSession(){
  try{ const raw = localStorage.getItem('mi_session'); if(raw) session = JSON.parse(raw); }catch(e){ session=null; }
}
async function submitLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginErr');
  errEl.classList.remove('show');
  if(!email || !password){ errEl.textContent='Enter email and password.'; errEl.classList.add('show'); return; }
  const { data, error } = await sb.rpc('mi_login', { p_email: email, p_password: password });
  if(error || !data || !data[0]){ errEl.textContent='Invalid email or password.'; errEl.classList.add('show'); return; }
  session = { token: data[0].token, name: data[0].user_name, id: data[0].user_id, role: data[0].user_role };
  localStorage.setItem('mi_session', JSON.stringify(session));
  enterApp();
}
function logout(){
  session = null;
  localStorage.removeItem('mi_session');
  document.getElementById('shell').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}
function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('shell').style.display='flex';
  document.getElementById('whoName').textContent = session.name;
  renderSidebar();
  switchSection('tasks');
}

function renderSidebar(){
  const el = document.getElementById('sidebarItems');
  el.innerHTML = SIDEBAR_SECTIONS.map(s=>{
    if(s.soon) return `<div class="sb-item soon"><span class="sb-icon">${s.icon}</span>${escapeHtml(s.label)}<span class="sb-soon-tag">Not built</span></div>`;
    return `<div class="sb-item ${currentSection===s.id?'active':''}" onclick="switchSection('${s.id}')"><span class="sb-icon">${s.icon}</span>${escapeHtml(s.label)}</div>`;
  }).join('');
}
function switchSection(id){
  currentSection = id;
  renderSidebar();
  const section = SIDEBAR_SECTIONS.find(s=>s.id===id);
  document.getElementById('pageTitle').textContent = section ? section.label : '';
  document.getElementById('tasksView').style.display = id==='tasks' ? 'block' : 'none';
  if(id==='tasks') loadAndRenderTasks();
}

// ---------- TASKS ----------
let tasksData = [];
async function loadAndRenderTasks(){
  const { data, error } = await sb.from('mi_tasks').select('*').order('created_at',{ascending:false});
  if(error){ console.error(error); return; }
  tasksData = data || [];
  renderTasksList();
}
function renderTasksList(){
  const q = (document.getElementById('taskSearch').value||'').trim().toLowerCase();
  const statusFilter = document.getElementById('taskFilterStatus').value;
  const priorityFilter = document.getElementById('taskFilterPriority').value;
  let rows = tasksData;
  if(q) rows = rows.filter(t=> (t.title||'').toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q));
  if(statusFilter) rows = rows.filter(t=> t.status===statusFilter);
  if(priorityFilter) rows = rows.filter(t=> t.priority===priorityFilter);

  const el = document.getElementById('tasksList');
  if(rows.length===0){ el.innerHTML = `<div class="empty-state">No tasks yet. Click "+ Create Task" to add one.</div>`; return; }

  el.innerHTML = rows.map(t=>{
    const statusClass = t.status==='Completed' ? 'completed' : (t.status==='In Progress' ? 'inprogress' : 'notstarted');
    const isHigh = t.priority==='High';
    return `<div class="task-card ${isHigh?'high':''}">
      <div class="task-card-top">
        <div>
          <div class="task-title">${escapeHtml(t.title)}</div>
          <div class="task-desc">${escapeHtml(t.description||'')}</div>
        </div>
        ${t.status!=='Completed' ? `<div class="task-complete-link" onclick="markTaskComplete('${t.id}')">Complete</div>` : ''}
      </div>
      <div class="task-meta">
        <span>👤 ${escapeHtml(t.assignee||'Unassigned')}</span>
        ${t.due_date?`<span>📅 Due: ${new Date(t.due_date).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span>`:''}
        <span>🚩 Priority: ${escapeHtml(t.priority||'--')}</span>
        ${t.profit_center?`<span>🏢 ${escapeHtml(t.profit_center)}</span>`:''}
        ${t.category_tag?`<span class="task-tag">${escapeHtml(t.category_tag)}</span>`:''}
        <span class="task-status ${statusClass}">${escapeHtml(t.status)}</span>
      </div>
    </div>`;
  }).join('');
}
document.getElementById('btnCreateTask').onclick = ()=>{
  ['tkTitle','tkDescription','tkAssignee','tkDueDate','tkCategoryTag','tkProfitCenter'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('tkPriority').value='--';
  document.getElementById('tkErr').classList.remove('show');
  openModal('modalCreateTask');
};
async function submitCreateTask(){
  const errEl = document.getElementById('tkErr');
  const title = document.getElementById('tkTitle').value.trim();
  if(!title){ errEl.textContent='Enter a title.'; errEl.classList.add('show'); return; }
  const task = {
    title, description: document.getElementById('tkDescription').value.trim(),
    assignee: document.getElementById('tkAssignee').value.trim(),
    due_date: document.getElementById('tkDueDate').value,
    priority: document.getElementById('tkPriority').value,
    category_tag: document.getElementById('tkCategoryTag').value.trim(),
    profit_center: document.getElementById('tkProfitCenter').value.trim()
  };
  const { error } = await sb.rpc('mi_create_task', { p_token: session.token, p_task: task, p_by: session.name });
  if(error){ errEl.textContent = error.message; errEl.classList.add('show'); return; }
  errEl.classList.remove('show');
  closeModal('modalCreateTask');
  await loadAndRenderTasks();
}
async function markTaskComplete(taskId){
  const { error } = await sb.rpc('mi_update_task_status', { p_token: session.token, p_task_id: taskId, p_status: 'Completed', p_by: session.name });
  if(error){ alert('Could not update task: ' + error.message); return; }
  await loadAndRenderTasks();
}

loadSession();
if(session) enterApp();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(e=>console.error('SW registration failed', e));
  });
}
</script>
</body>
</html>
