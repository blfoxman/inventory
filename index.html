<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MI Inventory Flow</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#17140f">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#17140f; --panel:#211d17; --panel2:#2a251d; --line:#3a3226;
    --text:#ede6d8; --dim:#a89a82; --amber:#e0a838; --amber-dim:#8a6a26; --rust:#c1573f; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .login-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:360px;padding:28px;}
  .login-box h1{margin:0 0 4px;font-size:20px;font-weight:700;}
  .login-box h1 span{color:var(--amber);}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:20px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13.5px;font-family:inherit;}
  button.primary{width:100%;margin-top:8px;font-size:13px;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600;border:1px solid var(--amber);background:var(--amber);color:#1a1509;}
  button.primary:hover{filter:brightness(1.08);}
  .err{color:var(--rust);font-size:12px;margin-top:6px;display:none;}
  .err.show{display:block;}

  #app{display:none;max-width:900px;margin:0 auto;padding:40px 16px;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  header h1{font-size:20px;font-weight:700;margin:0;}
  header h1 span{color:var(--amber);}
  .who{font-size:13px;color:var(--dim);}
  .who b{color:var(--text);}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:12.5px;cursor:pointer;}
  .empty-state{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--dim);}
  .empty-state h2{color:var(--text);font-size:16px;margin:0 0 8px;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>MI Inventory <span>Flow</span></h1>
    <div class="sub">Sign in to continue</div>
    <div class="field"><label>Email</label><input id="loginEmail" type="email"></div>
    <div class="field"><label>Password</label><input id="loginPassword" type="password"></div>
    <div class="err" id="loginErr"></div>
    <button class="primary" onclick="submitLogin()">Sign In</button>
  </div>
</div>

<div id="app">
  <header>
    <h1>MI Inventory <span>Flow</span></h1>
    <div class="who">Signed in as <b id="whoName"></b> &nbsp; <button class="ghost" onclick="logout()">Log out</button></div>
  </header>
  <div class="empty-state">
    <h2>Clean slate</h2>
    <div>Database and app have been reset. Tell Claude what to build first.</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://sspjcmnbdbbprtzmtigv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZTkMyAT-Ct8db7bZT8d-Qg_CgD9oIhL';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let session = null;

function loadSession(){
  try{ const raw = localStorage.getItem('mi_session'); if(raw) session = JSON.parse(raw); }catch(e){ session=null; }
}
async function submitLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginErr');
  errEl.classList.remove('show');
  if(!email || !password){ errEl.textContent='Enter email and password.'; errEl.classList.add('show'); return; }
  const { data, error } = await sb.rpc('mi_login', { p_email: email, p_password: password });
  if(error || !data || !data[0]){ errEl.textContent='Invalid email or password.'; errEl.classList.add('show'); return; }
  session = { token: data[0].token, name: data[0].user_name, id: data[0].user_id, role: data[0].user_role };
  localStorage.setItem('mi_session', JSON.stringify(session));
  enterApp();
}
function logout(){
  session = null;
  localStorage.removeItem('mi_session');
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}
function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoName').textContent = session.name;
}

loadSession();
if(session) enterApp();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(e=>console.error('SW registration failed', e));
  });
}
</script>
</body>
</html>
